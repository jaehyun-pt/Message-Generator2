<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>기말특강 멘트 생성기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@600;700&display=swap">
<style>
  /* Layout: a two-column workbench — settings on the left, the finished message on the right; stacks on phones. */
  :root {
    --bg: #F3F5F8;
    --panel: #FFFFFF;
    --fg: #1A2230;
    --muted: #5C6675;
    --line: #D9DEE6;
    --accent: #1F5FA8;
    --accent-soft: #E4EDF8;
    --accent-fg: #FFFFFF;
    --ok: #1E7F4F;
    --font-ui: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    --font-display: "Noto Serif KR", "Apple Myungjo", "Batang", serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12171F; --panel: #1A212B; --fg: #E6EAF0; --muted: #98A2B3; --line: #2C3542;
      --accent: #6FA3E6; --accent-soft: #1F2E42; --accent-fg: #0E1420; --ok: #5CC28A; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12171F; --panel: #1A212B; --fg: #E6EAF0; --muted: #98A2B3; --line: #2C3542;
    --accent: #6FA3E6; --accent-soft: #1F2E42; --accent-fg: #0E1420; --ok: #5CC28A; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 14px; line-height: 1.55; }
  .wrap {
    max-width: 1180px; margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 24px 40px;
  }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; margin-bottom: 20px; }
  h1 { font-family: var(--font-display); font-size: 24px; font-weight: 700; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
  header p { margin: 0; color: var(--muted); }
  .grid { display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); gap: 20px; align-items: start; }
  @media (max-width: 820px) { .grid { grid-template-columns: minmax(0, 1fr); } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; min-width: 0; }
  .controls { display: grid; gap: 18px; padding: 18px; }
  fieldset { border: 0; padding: 0; margin: 0; min-width: 0; display: grid; gap: 8px; }
  legend, label.lbl { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); padding: 0; margin-bottom: 6px; }
  .seg { display: flex; flex-wrap: wrap; gap: 6px; }
  .seg label { position: relative; }
  .seg input { position: absolute; opacity: 0; inset: 0; }
  .seg span {
    display: inline-block; padding: 7px 12px; border: 1px solid var(--line); border-radius: 999px;
    background: var(--panel); color: var(--fg); cursor: pointer; font-weight: 500; user-select: none;
  }
  .seg input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  .seg input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
  input[type="text"], select {
    width: 100%; font: inherit; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--panel); color: var(--fg);
  }
  input[type="text"]:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .hint { color: var(--muted); font-size: 12px; margin: 0; }
  .cat { display: grid; gap: 6px; }
  .cat-title { display: flex; align-items: baseline; gap: 8px; font-weight: 600; margin-top: 4px; }
  .cat-title small { color: var(--muted); font-weight: 400; }
  .check { display: flex; align-items: flex-start; gap: 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
  .check:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
  .check input { margin-top: 3px; accent-color: var(--accent); }
  .check .name { font-weight: 500; }
  .check .meta { color: var(--muted); font-size: 12px; }
  .output { display: grid; gap: 12px; padding: 18px; }
  .out-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
  .out-head .what { font-weight: 600; }
  .out-head .what small { color: var(--muted); font-weight: 400; margin-left: 8px; }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  button {
    font: inherit; font-weight: 600; padding: 9px 16px; border-radius: 8px; border: 1px solid var(--accent);
    background: var(--accent); color: var(--accent-fg); cursor: pointer;
  }
  button.ghost { background: var(--panel); color: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  textarea {
    width: 100%; min-height: 560px; font: inherit; line-height: 1.7; padding: 14px; border: 1px solid var(--line);
    border-radius: 8px; background: var(--panel); color: var(--fg); resize: vertical;
  }
  textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .status { display: flex; justify-content: space-between; gap: 10px; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .status .ok { color: var(--ok); font-weight: 600; }
  @media (prefers-reduced-motion: no-preference) { .seg span, .check, button { transition: background-color .15s, border-color .15s; } }
</style>

<div class="wrap">
  <header>
    <h1>기말특강 멘트 생성기</h1>
    <p>학년과 멘트 유형을 고르고 결제링크를 붙여 학부모 발송용 멘트를 만듭니다.</p>
  </header>

  <div class="grid">
    <section class="panel controls" aria-label="설정">
      <div>
        <label class="lbl" for="teacher">선생님 이름</label>
        <input type="text" id="teacher" placeholder="예: 손성재" autocomplete="off">
        <p class="hint">비워두면 멘트에 [    ] 빈칸으로 남습니다.</p>
      </div>

      <fieldset>
        <legend>학년</legend>
        <div class="seg" id="grade">
          <label><input type="radio" name="grade" value="중1" id="g-m1"><span>중1</span></label>
          <label><input type="radio" name="grade" value="중2" id="g-m2"><span>중2</span></label>
          <label><input type="radio" name="grade" value="중3" id="g-m3"><span>중3</span></label>
          <label><input type="radio" name="grade" value="고1" id="g-h1" checked><span>고1</span></label>
          <label><input type="radio" name="grade" value="고2" id="g-h2"><span>고2</span></label>
        </div>
      </fieldset>

      <fieldset id="rangeBox" hidden>
        <legend>중3 시험범위</legend>
        <div class="seg">
          <label><input type="radio" name="range" value="A" id="r-a" checked><span>삼각비 ~ 원주각의 활용</span></label>
          <label><input type="radio" name="range" value="B" id="r-b"><span>원의 성질 ~ 통계</span></label>
        </div>
        <p class="hint">감성형은 두 범위 공통 멘트를 씁니다.</p>
      </fieldset>

      <fieldset>
        <legend>멘트 유형</legend>
        <div class="seg">
          <label><input type="radio" name="tone" value="info" id="t-info" checked><span>정보형</span></label>
          <label><input type="radio" name="tone" value="emo" id="t-emo"><span>감성형</span></label>
        </div>
      </fieldset>

      <div>
        <label class="lbl" for="product">결제링크 상품</label>
        <select id="product">
          <option value="MH">12시간 고등 — MH 수학 4주 집중PT_3시간</option>
          <option value="MM">12시간 초중등 — MM 수학 4주 집중PT_3시간</option>
          <option value="BASE">6시간 — 수학 3주 집중PT_2시간</option>
          <option value="NONE">링크 없이 멘트만</option>
        </select>
        <p class="hint">학년을 바꾸면 기본값(중: 12시간 초중등, 고: 12시간 고등)으로 돌아갑니다.</p>
      </div>

      <fieldset>
        <legend>링크 구성</legend>
        <div class="seg">
          <label><input type="radio" name="days" value="both" id="d-both" checked><span>주간 + 주말</span></label>
          <label><input type="radio" name="days" value="주간" id="d-wd"><span>주간만</span></label>
          <label><input type="radio" name="days" value="주말" id="d-we"><span>주말만</span></label>
        </div>
      </fieldset>

      <fieldset>
        <legend>기타</legend>
        <label class="check"><input type="checkbox" id="imgMark"><div><div class="name">(이미지 2개) 자리 표시 넣기</div><div class="meta">인사말 다음 줄에 넣습니다</div></div></label>
      </fieldset>
    </section>

    <section class="panel output" aria-label="완성 멘트">
      <div class="out-head">
        <div class="what" id="what">고1 · 정보형</div>
        <div class="btns">
          <button type="button" id="copyBtn">멘트 복사</button>
          <button type="button" class="ghost" id="resetBtn">다시 생성</button>
        </div>
      </div>
      <textarea id="out" spellcheck="false" aria-label="완성 멘트"></textarea>
      <div class="status"><span id="count"></span><span id="copied"></span></div>
    </section>
  </div>
</div>

<script>

  };
  var LABELS = { MH: "12시간 고등", MM: "12시간 초중등", BASE: "6시간" };

  var GREETING = "안녕하세요, 학부모님. 밀당PT 수학 {NAME} 선생님입니다.";
  var COMMON_GAP = "내신 시험은 기본 개념+유형을 확인하는 문제뿐 아니라 여러 개념을 결합하거나 기존 유형을 변형한 응용~심화 문제까지 출제될 수 있습니다.\n따라서 개념을 이해하는 것과 실제 시험에서 응용문제를 해결하는 것 사이에는 분명한 차이가 있습니다.\n\n그래서 이번 특강에서는 단순히 개념과 유형을 한 번 더 확인하는 데 그치지 않습니다.";
  var COMMON_GOAL = "를 통해 학생들이 문제를 마주했을 때 막막함을 느끼는 것이 아니라, 주어진 조건을 분석하고 적절한 개념과 풀이 방향을 스스로 찾아낼 수 있도록 하는 것이 이번 특강의 목표입니다.";

  // Each template: intro (after greeting), body (after image marker), list (①~④), closing. {NAME} replaced.
  var INFO = {
    "중1": {
      intro: "다가오는 2학기 기말고사에서 확실한 성적 향상을 이끌어내고 실전 경쟁력을 높이기 위해 [중1 2학기 기말고사 대비 특강]을 개설하게 되었습니다.",
      body: "이번 기말고사 범위에서 학생들이 어려움을 느끼기 쉬운 부분은 '작도와 합동·평면도형의 논리적 서술'과 '입체도형의 겉넓이·부피 응용 문제'입니다.\n\n먼저 기본도형과 작도·합동 단원은 중학교에서 처음으로 '왜 그런지'를 조건에 근거해 설명해야 하는 단원입니다. 삼각형의 합동 조건을 알고 있더라도, 문제에서 주어진 조건이 어떤 합동 조건에 해당하는지 찾아내고 그 과정을 순서대로 서술하는 것은 전혀 다른 능력입니다. 특히 서술형 문항에서는 답이 맞아도 근거가 빠지면 감점되기 때문에, 조건을 읽고 논리 구조를 세우는 훈련이 반드시 필요합니다. 이어지는 평면도형 단원에서는 다각형의 내각·외각, 부채꼴의 호의 길이와 넓이가 여러 도형이 결합된 형태로 출제되어 공식 암기만으로는 대응하기 어렵습니다.\n\n또한, 입체도형 단원에서는 다면체와 회전체의 성질을 이해한 뒤 겉넓이와 부피를 구해야 하는데, 단순한 각기둥·원기둥이 아니라 일부가 잘린 입체, 구멍 뚫린 입체, 회전시켜 만든 도형처럼 변형된 형태가 자주 출제됩니다. 이런 문제는 입체를 머릿속에서 전개하거나 분해하는 공간 감각과 계산력을 동시에 요구하기 때문에, 개념을 알아도 실수가 잦은 단원입니다. 더불어 자료의 정리와 해석 단원은 도수분포표·히스토그램·상대도수를 서로 변환하며 읽어내야 하는데, 표의 빈칸을 채우거나 두 집단을 비교하는 문제에서 조건을 놓치는 학생이 많습니다. 이 단원들은 중2 도형의 성질과 중3 통계로 그대로 이어지는 기초인 만큼, 지금 확실히 다져두는 것이 중요합니다.",
      list: "① 작도·합동과 평면도형의 핵심 개념 및 서술형 논리 전개 훈련\n② 변형된 입체도형의 겉넓이·부피 응용문제 해결 훈련\n③ 도수분포표·히스토그램·상대도수의 해석 및 응용 유형 집중 훈련\n④ 타 학교 실제 내신 기출 및 고난도·변형 문제를 통한 실전 대비",
      closing: "정규 수업에서 다룬 핵심 개념을 바탕으로, 추가적인 유형 학습과 응용문제 훈련을 통해 실전 문제 해결력을 높일 예정입니다. 특히 중1 2학기 기말고사는 중학교 첫 1년을 마무리하는 시험이자, 중2부터 본격적으로 어려워지는 도형 단원의 출발점이 되는 시험입니다. 이번 특강을 통해 핵심 개념부터 고난도 응용까지 체계적으로 정리하고, 중학교 첫해를 좋은 성적과 단단한 기초로 마무리할 수 있도록 적극적인 수강을 권장드립니다."
    },
    "중2": {

      body: "고1 2학기 기말을 앞둔 아이들의 표정은 1학기 때와 많이 다릅니다. 중학교 때와는 비교할 수 없는 시험 난도를 두 번 겪고 나면, 아이들은 \"열심히 해도 안 되는 과목이 있다\"는 것을 처음으로 실감합니다. 이번 범위의 명제는 외워서 되는 단원이 아니라 논리를 따져야 하고, 합성함수·역함수, 유리·무리함수는 개념을 알아도 조건이 조금만 복잡해지면 손이 멈춥니다. 시험 전날까지 문제집을 붙잡고 있는데도 \"뭘 더 해야 할지 모르겠어\"라고 말하는 아이들이 가장 많은 시기가 바로 지금입니다.\n\n이 시험이 중요한 이유는 고1 내신의 마지막 숫자를 결정하기 때문만이 아닙니다. 이번 범위의 함수 개념은 고2 대수와 그 이후까지 계속 따라오는 뿌리이고, 무엇보다 아이가 \"나는 고등 수학에서도 해낼 수 있다\"는 확신을 가지고 고2로 올라가느냐를 결정하는 시험이기 때문입니다. 고2는 선택과목이 갈리고 난도가 한 번 더 뛰는 시기여서, 지금 만들어둔 확신이 없으면 그때 버티기가 훨씬 어렵습니다.\n\n학부모님께서는 아이가 책상 앞에 앉아 있는 모습은 보셔도, 그 앞에서 어디에 막혀 있는지는 보실 수 없을 것입니다. 그리고 그 막힌 곳을 풀어주는 일은 학부모님께서 하고 싶어도 하실 수 없는 영역입니다. 그래서 그 역할은 제가 맡겠습니다.",
      list: "① 명제와 절대부등식의 핵심 개념 및 논리적 접근 훈련\n② 합성함수와 역함수가 복합적으로 결합된 응용문제 해결 훈련\n③ 유리함수·무리함수 그래프 해석 및 응용 유형 집중 훈련\n④ 타 학교 실제 내신 기출 및 고난도·변형 문제를 통한 실전 대비",
      goal: "를 통해 아이가 어려운 문제 앞에서 막막해하는 대신, 주어진 조건을 분석하고 풀이 방향을 스스로 찾아내는 힘을 길러주는 것이 이번 특강의 목표입니다.",
      closing: "정규 수업에서 다져온 개념을 바탕으로, 시험장에서 실제로 점수가 되는 훈련을 집중적으로 하려고 합니다. 고1을 \"마지막 시험 잘 봤다\"는 기억으로 끝내는 것과 아쉬움으로 끝내는 것은, 고2를 시작하는 아이의 마음가짐을 완전히 다르게 만듭니다. 그 마무리를 함께 만들어드리고 싶습니다. 적극적인 수강을 권장드립니다."
    },
    "고2": {
      intro: "고3을 앞둔 마지막 정기고사가 다가오고 있습니다. 아이가 고2를 후회 없이 마무리하고 수능 준비의 첫걸음을 제대로 내딛을 수 있도록 [고2 미적분Ⅰ 기말고사 대비 특강]을 개설하게 되었습니다.",
      body: "고2 2학기, 미적분Ⅰ을 배우는 아이들은 여기까지 오는 동안 이미 많은 것을 견뎌왔습니다. 그런데 이번 범위의 도함수의 활용과 적분은 그동안 잘 따라오던 아이들조차 \"이건 정말 모르겠다\"고 처음으로 고개를 떨구게 만드는 구간입니다. 미분은 되는데 그래프가 안 그려지고, 적분 계산은 되는데 정적분으로 정의된 함수가 나오면 손이 멈추고, 문제를 읽으면 조건이 세 겹으로 쌓여 있습니다. 시험이 끝나고 \"미적분은 나랑 안 맞나 봐\"라는 말이 나오는 것이 이 시기입니다.\n\n그 말은 성적표가 아니라 아이의 자신감에 남습니다. 그리고 고3이 되면 그 자신감이 수능까지 1년을 버티게 하는 거의 유일한 힘입니다. 미적분Ⅰ은 수능 공통 범위에 들어가는 과목이어서 고3 내내 다시 마주하게 되는데, 지금 이 범위를 \"어려웠지만 해냈다\"로 정리하느냐, \"결국 못했다\"로 남기느냐가 고3 한 해의 출발점을 바꿉니다.\n\n학부모님께서는 아이가 밤늦게까지 책상에 앉아 있는 뒷모습만 보실 수 있을 것입니다. 무슨 말을 해도 부담이 될까 조심스러우실 것이고, 수학 내용을 직접 봐주실 수도 없는 영역입니다. 그 자리를 이번 특강에서 제가 채우겠습니다. 어디서 막히는지 정확히 찾아내고, 아이가 스스로 뚫고 나가는 경험을 만들어주는 것이 제 역할입니다.",
      list: "① 다항함수의 미분법과 미분가능성·미분계수 조건 해석 훈련\n② 그래프 개형 해석 중심의 도함수의 활용(극값·실근 개수·부등식) 응용문제 해결 훈련\n③ 정적분의 성질·정적분으로 정의된 함수와 정적분의 활용(넓이·속도와 거리) 집중 훈련\n④ 타 학교 실제 내신 기출 및 고난도·변형 문제를 통한 실전 대비",
      goal: "를 통해 아이가 고난도 문제 앞에서 막막해하는 대신, 조건을 분석하고 풀이의 흐름을 스스로 설계하는 힘을 길러주는 것이 이번 특강의 목표입니다.",
      closing: "정규 수업에서 쌓아온 개념 위에, 시험장에서 실제로 점수가 되는 훈련을 집중적으로 하려고 합니다. 고2 마지막 시험을 \"해냈다\"는 기억으로 마무리하는 아이는 고3을 다른 마음으로 시작합니다. 그 출발선을 함께 만들어드리고 싶습니다. 적극적인 수강을 권장드립니다."
    }
  };

  var $ = function (id) { return document.getElementById(id); };
  var out = $("out"), what = $("what"), count = $("count"), copied = $("copied");
  var teacher = $("teacher"), rangeBox = $("rangeBox"), imgMark = $("imgMark"), product = $("product");
  var dirty = false; // true once the user hand-edits the textarea

  function val(name) {
    var el = document.querySelector('input[name="' + name + '"]:checked');
    return el ? el.value : "";
  }

  function linkBlock() {
    var p = PRODUCTS[product.value];
    if (!p) return "";
    var days = val("days");
    var slots = days === "both" ? ["주간", "주말"] : [days];
    var parts = ["━━━━━━━━━━━━━━━", "▶ 기말 내신특강 수강 신청 (결제링크)"];
    slots.forEach(function (d) {
      parts.push("");
      parts.push("[" + d + "] " + p.name + " (" + p.weeks + " / 총 " + p.hours + ")");
      parts.push(p[d]);
    });
    parts.push("");
    parts.push("원하시는 시간대의 링크로 신청해 주시면 됩니다. 궁금한 점은 언제든 편하게 말씀해 주세요.");
    return parts.join("\n");
  }

  function build() {
    var grade = val("grade"), tone = val("tone");
    var name = teacher.value.trim() || "[    ]";
    var greeting = GREETING.replace("{NAME}", name);
    var img = imgMark.checked ? "\n\n(이미지 2개)" : "";
    var text;
    if (tone === "info") {
      var key = grade === "중3" ? "중3" + val("range") : grade;
      var t = INFO[key];
      text = [greeting + "\n" + t.intro + img, t.body, COMMON_GAP, t.list + "\n\n" + COMMON_GOAL, t.closing].join("\n\n");
    } else {
      var e = EMO[grade];
      text = [greeting + "\n" + e.intro + img, e.body, e.list + "\n\n" + e.goal, e.closing].join("\n\n");
    }
    var links = linkBlock();
    if (links) text += "\n\n" + links;
    return text;
  }

  function render(force) {
    if (dirty && !force) return;
    dirty = false;
    out.value = build();
    var grade = val("grade"), tone = val("tone");
    var rangeTxt = (grade === "중3" && tone === "info") ? (val("range") === "A" ? " · 삼각비~원주각" : " · 원의 성질~통계") : "";
    what.innerHTML = grade + rangeTxt + " · " + (tone === "info" ? "정보형" : "감성형") +
      "<small>" + (LABELS[product.value] ? LABELS[product.value] + " 링크 포함" : "링크 없음") + "</small>";
    updateCount();
    copied.textContent = "";
  }
  function updateCount() { count.textContent = out.value.length.toLocaleString("ko-KR") + "자"; }

  function applyGradeDefaults() {
    var grade = val("grade");
    product.value = grade.charAt(0) === "중" ? "MM" : "MH";
    rangeBox.hidden = !(grade === "중3" && val("tone") === "info");
  }

  document.querySelectorAll('input[name="grade"]').forEach(function (r) {
    r.addEventListener("change", function () { applyGradeDefaults(); render(true); });
  });
  document.querySelectorAll('input[name="tone"]').forEach(function (r) {
    r.addEventListener("change", function () { rangeBox.hidden = !(val("grade") === "중3" && val("tone") === "info"); render(true); });
  });
  document.querySelectorAll('input[name="range"], input[name="days"], #product, #imgMark').forEach(function (el) {
    el.addEventListener("change", function () { render(true); });
  });
  teacher.addEventListener("input", function () {
    try { localStorage.setItem("ment-teacher", teacher.value); } catch (e) {}
    render(true);
  });
  out.addEventListener("input", function () { dirty = true; updateCount(); copied.textContent = "직접 수정됨 · '다시 생성'을 누르면 설정값으로 되돌립니다"; copied.className = ""; });

  $("resetBtn").addEventListener("click", function () { render(true); });
  $("copyBtn").addEventListener("click", function () {
    var text = out.value;
    function done(ok) {
      copied.textContent = ok ? "복사됐습니다. 카톡·문자에 붙여넣기 하세요." : "복사 권한이 없어 본문을 선택했습니다. ⌘C / Ctrl+C로 복사하세요.";
      copied.className = ok ? "ok" : "";
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { done(true); }, function () { out.focus(); out.select(); done(false); });
    } else { out.focus(); out.select(); done(false); }
  });

  try { var saved = localStorage.getItem("ment-teacher"); if (saved) teacher.value = saved; } catch (e) {}
  applyGradeDefaults();
  render(true);
})();
</script>

</body></html>
